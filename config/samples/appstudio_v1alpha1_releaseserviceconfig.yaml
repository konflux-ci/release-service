apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleaseServiceConfig
metadata:
  name: releaseserviceconfig-sample
spec:
  # AllowedGitResolvers restricts which git repositories and revisions can be used
  # for pipeline references. When empty, all URLs and revisions are permitted.
  #
  # Two matching modes (for both URLs and revisions):
  # 1. Exact string match: "https://github.com/org/repo" or "main" (no ^ or $ anchors)
  # 2. Regex pattern: "^https://github\\.com/org/repo(\\.git)?$" or "^release-.*$" (starts with ^ and ends with $)
  allowedGitResolvers:
    # Exact string match for URL, mixed exact and regex for revisions
    - url: "https://github.com/konflux-ci/release-service-catalog"
      revisions:
        - "main"              # Exact match
        - "production"        # Exact match
        - "^release-.*$"      # Regex: all release branches

    # Exact string match - with .git suffix, regex for version tags
    - url: "https://github.com/konflux-ci/release-service-catalog.git"
      revisions:
        - "^v[0-9]+\\.[0-9]+$"  # Regex: version tags like v1.0, v2.1

    # Regex pattern for URL - matches both with and without .git suffix
    - url: "^https://gitlab\\.cee\\.redhat\\.com/signing/signing(\\.git)?$"
      # No revisions specified - all revisions allowed for this URL pattern
