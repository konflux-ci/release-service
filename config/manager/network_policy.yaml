apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-controller-manager
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
  policyTypes:
  - Egress
  egress:
    - to:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            apiserver: "true"
            app: openshift-kube-apiserver
      ports:
        - port: 6443
          protocol: TCP
    - to:
      - ipBlock:
          cidr: 172.20.0.1/32  # CIDR of Kubernetes API Endpoint.
      ports:
        - port: 6443
          protocol: TCP
        - port: 443
          protocol: TCP
    # Open traffic to SeaLights
    - to:
      - ipBlock:
          cidr: 159.60.128.87/32
      ports:
        - port: 443
          protocol: TCP
    # Allow traffic to KubeArchive API server
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: product-kubearchive
        podSelector:
          matchLabels:
            app: kubearchive-api-server
      ports:
        - port: 8081
          protocol: TCP
    # Allow DNS queries so SeaLights can resolve the api url
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
    # RELEASE-2681: allow HTTPS egress to github.com so ResolveBranchToSHA can
    # authenticate with GITHUB_TOKEN instead of silently falling back to the
    # branch name. Full "git" range set from https://api.github.com/meta as of
    # 2026-09-09 - GitHub rotates the individual /32s over time, so re-fetch
    # that endpoint and update this list if resolution starts failing again
    # with a network/TLS error instead of a clean auth response.
    - to:
      - ipBlock:
          cidr: 140.82.112.0/20
      - ipBlock:
          cidr: 143.55.64.0/20
      - ipBlock:
          cidr: 172.182.252.133/32
      - ipBlock:
          cidr: 172.182.252.135/32
      - ipBlock:
          cidr: 185.199.108.0/22
      - ipBlock:
          cidr: 192.30.252.0/22
      - ipBlock:
          cidr: 20.175.192.146/32
      - ipBlock:
          cidr: 20.175.192.147/32
      - ipBlock:
          cidr: 20.199.39.227/32
      - ipBlock:
          cidr: 20.199.39.232/32
      - ipBlock:
